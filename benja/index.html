<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Registro de Películas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header-custom">
    <h2>🎬 Mis Películas</h2>

    <button id="menuBtn" class="menu-btn">
        ☰
    </button>
</header>


<nav id="menu" class="menu oculto">
    <button onclick="mostrarSeccion('inicio')">🏠 Inicio</button>
    <button onclick="mostrarSeccion('favoritas')">⭐ Favoritas</button>
    <button onclick="mostrarSeccion('contacto')">📞 Contacto</button>
</nav>


<main class="container py-4">

<section id="inicio">

<div class="card form-card p-4 shadow">

    <h2>➕ Agregar Película</h2>

    <form id="formPelicula">

        <input
            id="titulo"
            class="form-control mb-3"
            placeholder="🎬 Nombre"
            required
        >

        <select id="genero" class="form-select mb-3">
            <option>Acción</option>
            <option>Comedia</option>
            <option>Drama</option>
            <option>Terror</option>
        </select>

        <input
            id="puntaje"
            type="number"
            min="1"
            max="10"
            class="form-control mb-3"
            placeholder="⭐ Puntaje"
            required
        >

        <textarea
            id="comentario"
            class="form-control mb-3"
            placeholder="💬 Comentario">
        </textarea>

        <div class="form-check mb-3">
            <input id="favorita" type="checkbox" class="form-check-input">
            <label>⭐ Marcar favorita</label>
        </div>

        <button class="btn btn-success w-100">
            💾 Guardar Película
        </button>

    </form>
</div>


<select id="filtroGenero" class="form-select my-4">
    <option value="Todas">🎞 Todas</option>
    <option>Acción</option>
    <option>Comedia</option>
    <option>Drama</option>
    <option>Terror</option>
</select>

<div id="listaPeliculas" class="row g-3"></div>

</section>


<section id="favoritas" class="oculto">
    <h2>⭐ Tus Favoritas</h2>
    <div id="listaFavoritas" class="row g-3"></div>
</section>


<section id="contacto" class="oculto contacto-card">
    <h2>📞 Contacto</h2>
    <p>👨‍💻 Benjamín Baeza</p>
    <p>👨‍💻 Vicente Sepúlveda</p>
</section>

</main>

<script src="js/app.js"></script>

<div id="footer"></div>

</body>
</html>
